services:
  mongo:
    image: mongo:7
    container_name: markex-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - markex_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  markex_mongo:
